name: tera2
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tera-local-database-password}
      POSTGRES_DB: tera
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tera -d tera]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    profiles: [object-storage]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tera-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-tera-local-storage-secret}
    volumes: [evidence_data:/data]
    restart: unless-stopped
  storage-init:
    profiles: [object-storage]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tera-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-tera-local-storage-secret}
      S3_BUCKET: ${S3_BUCKET:-tera-evidence}
    entrypoint: [/bin/sh, -c]
    command:
      - 'until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing "local/$$S3_BUCKET" && mc anonymous set none "local/$$S3_BUCKET"'
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    volumes: [mail_data:/data]
    environment:
      MP_DATABASE: /data/mailpit.db
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tera:tera-local-database-password@postgres:5432/tera}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-local-development-change-this-to-a-random-64-character-secret}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-TERA <no-reply@tera.local>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tera-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-tera-local-storage-secret}
      S3_BUCKET: ${S3_BUCKET:-tera-evidence}
      MFA_REQUIRED_PRIVILEGED: ${MFA_REQUIRED_PRIVILEGED:-false}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-sarvam}
      SPEECH_PROVIDER_API_KEY: ${SPEECH_PROVIDER_API_KEY:-}
      SPEECH_PROVIDER_REGION: ${SPEECH_PROVIDER_REGION:-}
      SPEECH_PROVIDER_LANGUAGE: ${SPEECH_PROVIDER_LANGUAGE:-en}
      SPEECH_PROVIDER_ENDPOINT: ${SPEECH_PROVIDER_ENDPOINT:-}
      RECORDINGS_DIR: /data/recordings
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4.1-mini}
      SARVAM_WEBHOOK_SECRET: ${SARVAM_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173}
    volumes: [recordings_data:/data/recordings]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  evidence_data:
  mail_data:
  recordings_data:
